<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" font-family="sans-serif">
  <rect width="940" height="250" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M0,6 a6,6 0 0 1 6,-6 h928 a6,6 0 0 1 6,6 v26 h-940 z" fill="#10b981"/>
  <text x="16" y="22" fill="#fff" font-size="14" font-weight="700">찜 (bookmarks) — DTO</text>
  <g font-family="monospace" font-size="12" fill="#0f172a">
    <text x="16" y="52" fill="#64748b" font-weight="700">[ 회원 ]  JwtAuth</text>

    <text x="16" y="74"><tspan fill="#b45309">POST</tspan>   /me/bookmarks   { placeId }   →  { placeId, bookmarked:true }</text>
    <text x="16" y="92" fill="#64748b">    ※ 찜 추가 · ACTIVE place만 · 멱등(이미 찜이면 그대로)</text>

    <text x="16" y="114"><tspan fill="#b91c1c">DELETE</tspan> /me/bookmarks/:placeId   →  { placeId, bookmarked:false }</text>
    <text x="16" y="132" fill="#64748b">    ※ 찜 해제 · 멱등(없어도 성공)</text>

    <text x="16" y="158"><tspan fill="#047857">GET</tspan>    /me/bookmarks?cursor=&amp;limit=   (locale 헤더)</text>
    <text x="16" y="176">    →  { items[{ id, name, regionCode, imageUrl, <tspan fill="#b45309">visitStatus</tspan>, bookmarkedAt }], nextCursor }</text>

    <text x="16" y="204" fill="#b45309">    ※ visitStatus=VISITED|PLANNED · HIDDEN place 제외 · 찜한 최신순 · cursor(limit 기본 20/최대 100)</text>
    <text x="16" y="222" fill="#2563eb">    ※ FE: imageUrl 없으면 null · nextCursor=null이면 마지막 페이지</text>
  </g>
</svg>
